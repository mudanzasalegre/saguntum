<text x="28" y="70" font-size="26" font-family="Georgia,serif">Sondeo III · bajo la plaza</text>
<text x="28" y="96" font-size="15">Planta excavada de 10,65 × 4,85 m</text>
<path d="M101 135V391" fill="none" stroke="#897e69" stroke-width="2"/>
<g stroke="#897e69"><path d="M93 135h16m-14 64h12m-12 64h12m-12 64h12m-14 64h16"/></g>
<g fill="#626762" font-size="13" text-anchor="end"><text x="84" y="139">0 m</text><text x="84" y="203">−1 m</text><text x="84" y="267">−2 m</text><text x="84" y="331">−3 m</text><text x="84" y="395">−4 m</text></g>
<g fill="none" stroke-width="1.7">
<path stroke="#67744b" d="M101 135h53"/>
<path stroke="#a16a43" d="M101 231h53"/>
