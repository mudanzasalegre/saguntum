<g fill="#495953" font-size="14"><text x="166" y="161">Cota cero local en 2005.</text><text x="166" y="257">Primeras estructuras del siglo XIV.</text><text x="166" y="369">UE 3152, a 3,62 m de profundidad.</text><text x="166" y="416">Fondo alcanzado en este sondeo.</text></g>
