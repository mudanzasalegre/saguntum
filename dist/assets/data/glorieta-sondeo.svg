<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 465" role="img" aria-labelledby="title desc">
<title id="title">Sondeo III · cotas de la excavación de 2005</title>
<desc id="desc">Cuatro cotas a escala. Superficie a 48,02 metros sobre el nivel del mar. Cimientos del convento a 46,52. Nivel romano UE 3152 a 44,40. Gravas a 44,03. La distancia horizontal entre elementos no se representa.</desc>
